# Colours come from themes/zorin-{dark,light}.toml via this symlink; switch with `theme dark|light` in zsh.
# (Top-level import must stay above the first [table].)
import = ["~/.config/alacritty/theme.toml"]

# Font needed for Powerlevel10k icons (same as the GNOME Terminal profile)
[font]
size = 12.0
normal = { family = "MesloLGS NF", style = "Regular" }
bold = { family = "MesloLGS NF", style = "Bold" }
italic = { family = "MesloLGS NF", style = "Italic" }
bold_italic = { family = "MesloLGS NF", style = "Bold Italic" }

[window]
padding = { x = 6, y = 4 }
dimensions = { columns = 120, lines = 32 }

[scrolling]
history = 10000

# Copy/paste stay on Ctrl+Shift+C / Ctrl+Shift+V (Alacritty defaults), so Ctrl+C still interrupts.
# Ctrl+Shift+arrows are not bound here, so they go to zsh for word selection.

# Start every Alacritty window inside zellij (tabs/panes/sessions), in the colour theme picked with `theme`.
# zellij is resolved via PATH; install.sh puts it in /usr/local/bin
[shell]
program = "/bin/sh"
args = ["-c", "[ \"$(cat ~/.config/dotfiles/theme 2>/dev/null)\" = light ] && t=light || t=dark; exec zellij options --theme zorin-$t"]
